<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SkillHub</title>
  <link rel="stylesheet" href="/css/base.css?v=20261112-v9">
  <link rel="stylesheet" href="/css/layout.css?v=20261112-v9">
  <link rel="stylesheet" href="/css/components.css?v=20261112-v9">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <header class="app-bar">
    <button class="brand" type="button" id="brand-home"><span class="brand-mark" aria-hidden="true"></span>SkillHub</button>
    <nav id="primary-nav" aria-label="Main navigation">
      <button type="button" data-route="library" aria-current="page">Library</button>
      <button type="button" data-route="explore">Explore</button>
      <button type="button" data-route="settings">Settings</button>
    </nav>
    <span id="connection" class="connection" role="status"><span aria-hidden="true"></span><span>Connecting</span></span>
  </header>
  <main id="workspace" tabindex="-1">
    <section id="library-screen" class="screen" aria-label="Library"></section>
    <section id="reader-screen" class="screen" aria-label="Skill" hidden></section>
    <section id="editor-screen" class="screen" aria-label="Editor" hidden></section>
    <section id="explore-screen" class="screen" aria-label="Explore" hidden></section>
    <section id="settings-screen" class="screen" aria-label="Settings" hidden></section>
  </main>
  <div id="notifications" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/js/main.js?v=20261112-v9"></script>
</body>
</html>
